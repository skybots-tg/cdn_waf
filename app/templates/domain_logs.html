{% extends "base.html" %}
{% block title %}{{ domain.name }} - Logs - FlareCloud{% endblock %}
{% block content %}
<div class="container" style="padding: 32px 24px;">
    <div class="glass-card mb-4">
        <div class="flex-between">
            <div>
                <h1><i class="fas fa-file-alt"></i> {{ domain.name }} — Request Logs</h1>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 6px;">
                    Raw logs from edge nodes are kept for 30 days. Times are shown in your local time zone.
                </div>
            </div>
            <div class="flex gap-2">
                <a href="/domains/{{ domain.id }}/analytics" class="btn btn-secondary"><i class="fas fa-chart-line"></i> Analytics</a>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="glass-card mb-4">
        <form id="filters" onsubmit="event.preventDefault(); applyFilters();">
            <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: end;">
                <div>
                    <label class="form-label">Period</label>
                    <select class="form-select" name="range">
                        <option value="1h">Last hour</option>
                        <option value="24h" selected>Last 24 hours</option>
                        <option value="7d">Last 7 days</option>
                        <option value="30d">Last 30 days</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Status</label>
                    <select class="form-select" name="status_class">
                        <option value="">All</option>
                        <option value="2xx">2xx</option>
                        <option value="3xx">3xx</option>
                        <option value="4xx">4xx</option>
                        <option value="5xx">5xx</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Exact code</label>
                    <input class="form-input" name="status" type="number" min="100" max="599" placeholder="e.g. 404" style="width: 110px;">
                </div>
                <div>
                    <label class="form-label">Method</label>
                    <select class="form-select" name="method">
                        <option value="">All</option>
                        <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
                        <option>PATCH</option><option>HEAD</option><option>OPTIONS</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Cache</label>
                    <select class="form-select" name="cache_status">
                        <option value="">All</option>
                        <option>HIT</option><option>MISS</option><option>EXPIRED</option><option>STALE</option>
                        <option>BYPASS</option><option value="DYNAMIC">DYNAMIC</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Host</label>
                    <input class="form-input" name="host" placeholder="app.{{ domain.name }}" style="width: 180px;">
                </div>
                <div>
                    <label class="form-label">Path contains</label>
                    <input class="form-input" name="path" placeholder="/api/" style="width: 180px;">
                </div>
                <div>
                    <label class="form-label">Client IP</label>
                    <input class="form-input" name="ip" placeholder="203.0.113.5" style="width: 150px;">
                </div>
                <div>
                    <label class="form-label">Country</label>
                    <input class="form-input" name="country" maxlength="2" placeholder="RU" style="width: 70px; text-transform: uppercase;">
                </div>
                <div>
                    <label class="form-label">Per page</label>
                    <select class="form-select" name="limit">
                        <option>50</option><option selected>100</option><option>200</option><option>500</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Apply</button>
                <button type="button" class="btn btn-secondary" onclick="resetFilters()"><i class="fas fa-undo"></i> Reset</button>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-secondary);">
                    <input type="checkbox" id="live"> Live (10 s)
                </label>
            </div>
        </form>
    </div>

    <div class="glass-card">
        <div class="flex-between mb-3">
            <h3 style="font-size: 18px; font-weight: 600;"><i class="fas fa-list"></i> Requests</h3>
            <div id="logs-count" style="color: var(--text-muted); font-size: 14px;">—</div>
        </div>
        <div id="logs-container" style="overflow-x: auto;"></div>
        <div class="flex-between mt-3" id="pagination-container" style="display: none;">
            <button class="btn btn-secondary btn-sm" id="btn-prev" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i> Newer</button>
            <span id="page-info" style="color: var(--text-muted);">Page 1</span>
            <button class="btn btn-secondary btn-sm" id="btn-next" onclick="changePage(1)">Older <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</div>

<style>
.log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.log-table th { text-align: left; color: var(--text-secondary); font-weight: 500; padding: 8px; border-bottom: 1px solid var(--glass-border); white-space: nowrap; }
.log-table td { padding: 8px; border-bottom: 1px solid var(--glass-border); vertical-align: top; }
.log-row { cursor: pointer; }
.log-row:hover td { background: var(--bg-tertiary); }
.log-detail td { background: var(--bg-tertiary); font-size: 12px; }
.log-detail dl { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; margin: 0; }
.log-detail dt { color: var(--text-secondary); }
.log-detail dd { margin: 0; word-break: break-all; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>

<script src="/static/js/analytics.js?v={{ asset_v }}"></script>
<script>
const DOMAIN_ID = {{ domain.id }};
let page = 0;
let total = 0;
let liveTimer = null;

function params() {
    const form = new FormData(document.getElementById('filters'));
    const p = new URLSearchParams();
    for (const [k, v] of form.entries()) {
        const value = String(v).trim();
        if (value) p.set(k, k === 'country' ? value.toUpperCase() : value);
    }
    return p;
}

function limit() { return Number(params().get('limit') || 100); }

function applyFilters() {
    page = 0;
    const p = params();
    history.replaceState(null, '', window.location.pathname + '?' + p.toString());
    loadLogs();
}

function resetFilters() {
    document.getElementById('filters').reset();
    applyFilters();
}

function changePage(delta) {
    page = Math.max(0, page + delta);
    loadLogs();
}

async function loadLogs() {
    const container = document.getElementById('logs-container');
    if (!container.innerHTML) FC.loading(container);
    const p = params();
    p.set('offset', String(page * limit()));
    try {
        const r = await fetch(`/api/v1/domains/${DOMAIN_ID}/logs?${p.toString()}`);
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        total = Number(r.headers.get('X-Total-Count') || 0);
        const logs = await r.json();
        render(logs);
    } catch (e) { FC.error(container, e); }
}

function render(logs) {
    const container = document.getElementById('logs-container');
    const from = total ? page * limit() + 1 : 0;
    const to = page * limit() + logs.length;
    document.getElementById('logs-count').textContent = total ? `${FC.num(from)}–${FC.num(to)} of ${FC.num(total)}` : 'No matching requests';
    const pages = Math.max(1, Math.ceil(total / limit()));
    document.getElementById('pagination-container').style.display = total > limit() ? 'flex' : 'none';
    document.getElementById('page-info').textContent = `Page ${page + 1} of ${pages}`;
    document.getElementById('btn-prev').disabled = page === 0;
    document.getElementById('btn-next').disabled = page + 1 >= pages;
    if (!logs.length) return FC.empty(container, 'No requests match these filters');

    container.innerHTML = `<table class="log-table"><thead><tr>
        <th>Time</th><th>Method</th><th>Host / path</th><th>Status</th><th>Cache</th><th>Client</th><th>Size</th><th>Time taken</th>
        </tr></thead><tbody>${logs.map((l, i) => `
        <tr class="log-row" onclick="toggleDetail(${i})">
            <td style="white-space:nowrap;" title="${FC.escape(FC.relative(l.timestamp))}">${FC.escape(FC.localTime(l.timestamp))}</td>
            <td><strong>${FC.escape(l.method)}</strong></td>
            <td class="mono" style="word-break:break-all;"><span style="color:var(--text-muted);">${FC.escape(l.host || '')}</span>${FC.escape(l.path)}${l.query_string ? '<span style="color:var(--text-muted);">?' + FC.escape(l.query_string) + '</span>' : ''}</td>
            <td style="color:${FC.statusColor(l.status)};font-weight:600;">${FC.escape(l.status)}${l.waf_status ? ' <span class="badge badge-error">' + FC.escape(l.waf_status) + '</span>' : ''}</td>
            <td>${FC.cacheBadge(l.cache_status)}</td>
            <td style="white-space:nowrap;">${FC.flag(l.country_code)} <span class="mono">${FC.escape(l.client_ip)}</span></td>
            <td style="white-space:nowrap;">${FC.bytes(l.bytes_sent)}</td>
            <td style="white-space:nowrap;">${FC.ms(l.request_time)}</td>
        </tr>
        <tr class="log-detail" id="detail-${i}" style="display:none;"><td colspan="8"><dl>
            <dt>Time (UTC)</dt><dd class="mono">${FC.escape(l.timestamp)}</dd>
            <dt>Country</dt><dd>${FC.country(l.country_code)}</dd>
            <dt>Referer</dt><dd class="mono">${FC.escape(l.referer || '—')}</dd>
            <dt>User agent</dt><dd class="mono">${FC.escape(l.user_agent || '—')}</dd>
            <dt>WAF</dt><dd>${l.waf_status ? FC.escape(l.waf_status) + (l.waf_rule_id ? ' (rule #' + l.waf_rule_id + ')' : '') : '—'}</dd>
            <dt>Filter</dt><dd>
                <a href="#" onclick="event.preventDefault(); filterBy('ip', '${FC.escape(l.client_ip)}')">same IP</a> ·
                <a href="#" onclick="event.preventDefault(); filterBy('path', '${FC.escape((l.path || '').replace(/'/g, ''))}')">same path</a>
            </dd>
        </dl></td></tr>`).join('')}</tbody></table>`;
}

function toggleDetail(i) {
    const row = document.getElementById('detail-' + i);
    row.style.display = row.style.display === 'none' ? '' : 'none';
}

function filterBy(name, value) {
    const input = document.getElementById('filters').elements[name];
    if (input) { input.value = value; applyFilters(); }
}

document.addEventListener('DOMContentLoaded', () => {
    // Фильтры из адреса: ссылку на выборку можно переслать.
    const form = document.getElementById('filters');
    new URLSearchParams(window.location.search).forEach((v, k) => { if (form.elements[k]) form.elements[k].value = v; });
    document.getElementById('live').addEventListener('change', e => {
        clearInterval(liveTimer);
        if (e.target.checked) liveTimer = setInterval(() => { if (page === 0) loadLogs(); }, 10000);
    });
    loadLogs();
});
</script>
{% endblock %}
