# Serve ACME http-01 challenges from the cdn_waf control plane.
#
# Deploy to /etc/nginx/snippets/acme-control-plane.conf on an ORIGIN server and
# include it inside the `listen 443 ssl` server block of every proxied vhost:
#
#     include /etc/nginx/snippets/acme-control-plane.conf;
#
# Why: panel-issued certificates are validated over http-01, and edge nginx
# proxies /.well-known/acme-challenge/ to the control plane. That path only
# exists while an edge node is enabled — with the fleet disabled, DNS falls back
# to the origin and validation has nowhere to land. This snippet gives the origin
# the same passthrough, so renewal works in both regimes.
#
# Port 80 keeps its certbot-managed HTTP->HTTPS redirect; Let's Encrypt follows
# the 301 and ignores certificate errors on the redirect target, so the challenge
# still resolves here.
#
# Skip vhosts that already define their own acme-challenge location (nginx
# rejects a duplicate location in the same server block).
location /.well-known/acme-challenge/ {
    proxy_pass http://127.0.0.1:2000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
